[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short

markers =
    functional: Functional tests - does each feature work in isolation
    smoke: Smoke tests - is the build stable enough to test further
    sanity: Sanity tests - narrow check that a specific fix/area works
    retesting: Retesting - re-verifying a previously failed/fixed scenario
    regression: Regression tests - nothing else broke after a change
    integration: Integration tests - multiple features/pages working together
    system: System tests - full end-to-end user flow across the whole site
    uat: User acceptance tests - business-facing real-world scenarios
    exploratory: Exploratory support checks - assertions that back up manual exploration
